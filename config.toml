# Configuration de la préparation des données (src/prepare.py).
# Toute valeur qui influence un résultat est ici, pas dans le code.

[data]
raw_dir = "data/raw"
processed_dir = "data/processed"
csv_files = ["UNSW-NB15_1.csv", "UNSW-NB15_2.csv", "UNSW-NB15_3.csv", "UNSW-NB15_4.csv"]
features_file = "NUSW-NB15_features.csv"

[download]
# Vérification des fichiers bruts (src/download.py). Pas de téléchargement
# automatique : la page officielle renvoie vers un partage SharePoint qui exige
# un navigateur. Empreintes SHA-256 des fichiers utilisés pour toutes les mesures
# du journal (calculées sur data/raw le 2026-10-01).
page = "https://research.unsw.edu.au/projects/unsw-nb15-dataset"

[download.sha256]
"UNSW-NB15_1.csv" = "7d851bbeabd27894ce39c8e78835c73341fc946652fb7743b9eff193b55eb511"
"UNSW-NB15_2.csv" = "6130ad02873cc6069ae695cf2844f2e8c2e9a9a1b7532dd82ab8f202757cacf8"
"UNSW-NB15_3.csv" = "ae990a96c3dfcd425ce2801aadb1727a34d5e0ae6d8215dbcdae60dedfaef640"
"UNSW-NB15_4.csv" = "cdf563692d51d405541dd659ddcdad9fa01f001f05fe9fc4b67f00ca12fbc96a"
"NUSW-NB15_features.csv" = "c55f19cceebb6360dc50f44f8a5f246ccefbcf8a6c604ac1ad46e643869cafce"
"UNSW-NB15_LIST_EVENTS.csv" = "5b40f8128e2c87e691157c76debde04c328b0eb66bab97f1e7e17625f84497f2"

[split]
# Découpage temporel (M05) : Stime >= day2_start (UTC) -> entraînement (jour 2),
# Stime < day2_start -> test (jour 1, 22-01 et 23-01).
day2_start = "2015-02-18"

[families]
canonical = ["Normal", "Analysis", "Backdoors", "DoS", "Exploits", "Fuzzers",
             "Generic", "Reconnaissance", "Shellcode", "Worms"]
# Familles retirées de l'entraînement supervisé de la condition C (M10).
removed = ["Exploits", "Reconnaissance"]

# Clés en minuscules, après strip(). Backdoor et Backdoors sont une même famille
# écrite de deux façons selon le lot d'étiquetage (M02, M05).
[families.aliases]
backdoor = "Backdoors"

[features]
# Identifiants et horodatages, exclus des features (M08). Stime sert au
# découpage et reste dans les fichiers écrits comme métadonnée, pas comme feature.
excluded = ["srcip", "sport", "dstip", "dsport", "Stime", "Ltime"]
nominal = ["proto", "state", "service"]
# Vides au jour 2 seulement, alors que le jour 1 écrit 0 explicitement (M11).
blank_as_zero = ["ct_flw_http_mthd", "is_ftp_login", "ct_ftp_cmd"]

[sampling]
# Condition B : autant d'attaques que la condition C, tirées au hasard
# proportionnellement aux familles de A (M10). Graine unique de tout le tirage.
seed = 42

[preprocessing]
# Catégories dont la fréquence dans le jeu d'entraînement est inférieure à cette
# fraction sont regroupées en une modalité « rare » ; les catégories jamais vues
# à l'entraînement y sont aussi envoyées. Valeur par défaut à valider (M11).
min_frequency = 0.001

# log1p appliqué AVANT le scaler aux colonnes numériques dont l'asymétrie
# (skewness) mesurée sur le jeu d'entraînement dépasse ce seuil. La liste n'est
# pas écrite à la main : elle est calculée à l'ajustement, par jeu, sur
# l'entraînement seul, et écrite dans manifest.json. Valeur 2 : pour tout seuil
# entre 1,75 et 2,77 la liste est identique dans les quatre jeux (M12), donc
# le prétraitement ne diffère pas entre B et C ; en dessous, log1p sur-corrige
# (Dload, dmeansz : l'asymétrie change de signe et grandit en valeur absolue).
log1p_skew_threshold = 2.0

[evaluation]
# Budgets de faux positifs rapportés : part des flux normaux qui déclenchent une
# alerte. Au débit mesuré d'environ 80 000 flux normaux par heure (M15) :
# 1 % ~ 800 fausses alertes/h, 0,1 % ~ 80, 0,01 % ~ 8.
fpr_budgets = [0.01, 0.001, 0.0001]
# Budget de référence pour la comparaison entre modèles (M16). À revoir à la
# lecture si le rappel à ce budget manque de contraste.
reference_fpr = 0.001
# Niveau des intervalles de confiance de Wilson (1 - confidence_alpha).
confidence_alpha = 0.05

[isolation_forest]
# Valeurs par défaut de la bibliothèque, non réglées : régler sur des attaques
# romprait le protocole non supervisé (M16). max_samples = "auto" vaut
# min(256, nombre de lignes). Graine fixée : le résultat est reproductible.
n_estimators = 100
max_samples = "auto"
seed = 42
n_jobs = -1
# Nombre de blocs de temps contigus pour les scores hors échantillon qui
# calibrent le seuil (option 3 de M16) ; chaque modèle voit (k-1)/k des normaux.
cv_folds = 5

[autoencoder]
# Décidé et committé AVANT tout résultat de l'autoencodeur (M19). Deux
# architectures déclarées d'avance et rapportées sur le même pied : aucun choix
# entre elles après lecture des résultats. Perte MSE sans écrêtage, nombre
# d'epochs fixe (pas d'arrêt précoce), identique pour les blocs de calibration
# et le modèle final.
epochs = 30
batch_size = 1024
learning_rate = 0.001
seed = 42
# 4 threads : 8 sont 4 à 6 fois plus lents sur ces petits réseaux (M18).
threads = 4
# Même calibration que l'Isolation Forest : blocs de temps contigus (M16).
cv_folds = 5

# Tailles des couches cachées, la dernière est le goulot. « moyen » est
# l'architecture principale ; « petit » est déclaré d'avance et rapporté à égalité.
[autoencoder.architectures]
moyen = [128, 64, 16]
petit = [32, 16, 8]

[supervised]
# Décidé et committé AVANT la recherche d'hyperparamètres (M23).
# Bibliothèque : XGBoost (paquet xgboost-cpu), choisie pour l'installation sans
# dépendance système (M22). Tous les hyperparamètres non listés dans la grille
# gardent les valeurs par défaut de la bibliothèque (taux d'apprentissage,
# sous-échantillonnage, régularisation, poids de classes non modifié).
seed = 42
threads = 4
# Même découpage en blocs de temps contigus que les modèles non supervisés (M16).
cv_folds = 5
# Les hyperparamètres sont choisis UNE FOIS, sur les données de la condition C
# (familles retirées absentes), puis figés pour A, B et C : les familles retirées
# n'influencent ainsi aucune décision, même indirectement, et les trois
# conditions ne diffèrent que par leurs données.
tuning_set = "C"
# Critère de sélection : moyenne, sur les 5 blocs de temps tenus à l'écart, de la
# précision moyenne (AUC-PR) calculée bloc par bloc sur ses normaux et ses
# attaques. Configuration retenue = celle de moyenne la plus haute ; à égalité à
# 4 décimales, la moins coûteuse (moins d'arbres, puis profondeur moindre).
selection_criterion = "mean_fold_average_precision"

# Grille : 4 configurations.
[supervised.grid]
max_depth = [6, 10]
n_estimators = [100, 300]
